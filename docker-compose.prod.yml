services:
  # Backend API - Optimizado para produção
  backend:
    image: carrinhos-api:latest
    container_name: carrinhos-api-prod
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - APP_CORS_ALLOWED_ORIGIN_PATTERNS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,https://*.onrender.com
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - carrinhos-network

  # Frontend Web - Optimizado para produção
  frontend:
    image: carrinhos-web:latest
    container_name: carrinhos-web-prod
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      - API_URL=http://backend:8080/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - carrinhos-network

networks:
  carrinhos-network:
    driver: bridge
