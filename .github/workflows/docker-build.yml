name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        run: |
          cd backend-api
          docker build -t carrinhos-api:${{ github.sha }} .
          docker build -t carrinhos-api:latest .

      - name: Test Backend Build
        run: |
          docker run --rm carrinhos-api:latest --version || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Frontend Image
        run: |
          cd frontend-web
          docker build -t carrinhos-web:${{ github.sha }} .
          docker build -t carrinhos-web:latest .

  docker-compose-test:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build with Docker Compose
        run: |
          docker-compose build

      - name: Start Services
        run: |
          docker-compose up -d
          sleep 10

      - name: Health Check Backend
        run: |
          curl -f http://localhost:8080/api/professores || exit 1

      - name: Stop Services
        run: |
          docker-compose down
